<head>

<title>مزرعة الواحات</title>

<link rel="icon" href="icon-192.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F5F2EA; --card:#FFFFFF; --ink:#26241F; --muted:#6F6A5F; --line:#E3DED2;
--green:#2F7A3E; --amber:#C98A12; --red:#B83A26; --brown:#6E4B33; --empty:#A39E92;
--accent:#2F5D46; --accent-soft:#E4EEE7; --sand:#EFE7D6;
--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--accent);color:#fff}
header h1{font-size:17px;margin:0;font-weight:600;flex:1}
header .sync{font-size:11px;opacity:.85;flex-basis:100%;order:9;margin-top:-4px}
header{flex-wrap:wrap}
.hbtn{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
main{flex:1;overflow:auto;position:relative}
nav.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:600}
.view{display:none;padding:14px}
.view.on{display:block}
#v-map{padding:0;height:100%;position:relative}
#v-map.on{display:flex;flex-direction:column}
.maptools{display:flex;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.maptools select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:13px}
.mapwrap{flex:1;position:relative;overflow:hidden;background:#EDE6D4;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab}
.zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.legend{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.94);border-radius:12px;padding:8px 10px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.1);max-width:60%}
.legend div{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer}
.legend div.off{opacity:.35}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:12px 0 6px;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi b{display:block;font-size:22px;font-weight:700}
.kpi span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n,th.n{text-align:center;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.note{background:var(--sand);border-radius:10px;padding:10px 12px;font-size:13px;color:#5A4A2E;line-height:1.6}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.f-in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
textarea.f-in{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.35);display:none;z-index:20}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:900px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;max-height:86vh;overflow:auto;z-index:21;transform:translateY(105%);transition:transform .22s ease;padding:8px 16px 22px;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:#D9D3C5;margin:4px auto 10px}
.ph{display:flex;align-items:center;gap:10px}
.ph .code{font-size:22px;font-weight:700;letter-spacing:.5px}
.ph .x{margin-inline-start:auto;border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fact{background:var(--bg);border-radius:10px;padding:8px 10px}
.fact span{display:block;font-size:11px;color:var(--muted)}
.fact b{font-weight:600;font-size:14px}
.loglist .li{border-bottom:1px solid var(--line);padding:9px 0;display:flex;gap:10px}
.loglist .li:last-child{border-bottom:0}
.li .ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.li .bd{flex:1;min-width:0}
.li .t{font-weight:600;font-size:14px}
.li .m{font-size:12px;color:var(--muted)}
.li .tx{font-size:13px;margin-top:2px;white-space:pre-wrap}
.li .m .pend{color:#C98A12}
.li img{max-width:120px;border-radius:8px;margin-top:6px;display:block}
.li .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px}
.banner{background:#FFF4D6;color:#6A4E00;font-size:13px;padding:8px 12px;display:none}
.banner.on{display:block}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#26241F;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.month-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.month-tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer}
.month-tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.task{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:0}
.task .q{margin-inline-start:auto;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.task .q small{display:block;color:var(--muted);font-size:11px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.findbar{display:flex;gap:6px;align-items:center}
.findbar input{width:110px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;direction:ltr;text-align:center}
@media (min-width:700px){.kpis{grid-template-columns:repeat(6,1fr)}}
</style>
</head>

</nav>
</div>

/* ---------- persistence: Google Sheet API + offline queue ---------- */
const API='https://script.google.com/macros/s/AKfycbzE-0pmmZU6ZN2q4pJy0uSm8hRXm2cxZHQxFUwkt8yDNFT3zKDy0xVHg4hC3LF-qnv78w/exec';
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}}};
let PINV=LS.get('wf_pin')||''; me=LS.get('wf_name')||'';
let QUEUE=[];try{QUEUE=JSON.parse(LS.get('wf_queue')||'[]')}catch(e){QUEUE=[]}
const saveQueue=()=>LS.set('wf_queue',JSON.stringify(QUEUE));
const QUEUED={queued:true};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
class NetErr extends Error{}
async function api(a,args){
let r;
try{
if(a==='getAll')r=await fetch(API+'?a=getAll&t='+Date.now(),{cache:'no-store'});
else r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,pin:PINV,args})});
}catch(e){throw new NetErr('net')}
if(!r.ok)throw new NetErr('http '+r.status);
let j;try{j=await r.json()}catch(e){throw new NetErr('bad json')}
if(!j.ok)throw new Error(j.error||'error');
return j.data;
}
function askText(title,hint,val,type){return new Promise(res=>{
const inp=el('input',{class:'f-in',value:val||'',type:type||'text',inputmode:type==='password'?'numeric':'text'});
let done=false;const fin=v=>{if(done)return;done=true;res(v)};
formShell(title,el('div',{},el('p',{class:'muted'},hint),inp),async()=>{const v=inp.value.trim();if(!v){toast('اكتب الأول');return}closeSheet();fin(v)},'تمام');
const x=$('#sheetBody .x');if(x)x.addEventListener('click',()=>fin(null));
setTimeout(()=>inp.focus(),250)})}
const askPin=()=>askText('الرقم السري','الرقم السري ده بيديهولك صاحب الأرض عشان تقدر تسجّل.','', 'password');
async function ensureName(){if(me)return true;const n=await askText('اسمك ايه؟','الاسم بيتكتب جنب كل تسجيل عشان يتعرف مين عمل ايه.','');if(!n)return false;me=n;LS.set('wf_name',n);$('#whoName').textContent=n;return 'asked'}
async function send(a,args){
try{return await api(a,args)}
catch(e){
if(e instanceof NetErr){QUEUE.push({a,args});if(!saveQueue()){QUEUE.pop();throw new Error('مساحة الموبايل مش كفاية للحفظ أوفلاين — جرّب من غير صورة')}updateStatus();return QUEUED}
if(/PIN/.test(e.message)){const p=await askPin();if(p==null)throw e;PINV=p;LS.set('wf_pin',p);return send(a,args)}
throw e}}
let flushing=false;
async function flushQueue(){
if(flushing||!QUEUE.length)return;flushing=true;let sent=0;
try{while(QUEUE.length){const it=QUEUE[0];
try{await api(it.a,it.args)}
catch(e){if(e instanceof NetErr)break;
if(/PIN/.test(e.message)){const p=await askPin();if(p==null)break;PINV=p;LS.set('wf_pin',p);continue}
toast('تسجيل ما اتقبلش واتشال: '+e.message)}
QUEUE.shift();saveQueue();sent++}}
finally{flushing=false;updateStatus()}
if(sent){toast('اتبعت '+sent+' تسجيل كان مستني ✓');refresh()}
}
function applyQueued(){for(const it of QUEUE){
if(it.a==='savePalm'){const[id,ch,log]=it.args;OV.set(id,Object.assign({},OV.get(id)||{},ch));if(log)LOGS.unshift(Object.assign({scope:'palm',palmId:id,sector:+id.split('-')[0],by:me,at:'9',pending:1},log))}
else if(it.a==='addLog'){const[e,b64]=it.args;LOGS.unshift(Object.assign({},e,{by:me,at:'9',pending:1,photo:b64?('data:image/jpeg;base64,'+b64):''}))}
else if(it.a==='saveIrr'){const[s,c]=it.args;IRR[s]=c}
else if(it.a==='deleteLog'){const[id]=it.args;LOGS=LOGS.filter(l=>l.id!==id)}}}
function fail(e){const m=String(e&&e.message||e);if(/PIN/.test(m))toast('الرقم السري غلط');else toast(m.length<80?m:'ما اتحفظش — جرّب تاني');refresh()}
function photoB64(file){return new Promise((res,rej)=>{try{
const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height));
const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8).split(',')[1])};img.onerror=rej;img.src=url}catch(e){rej(e)}})}
const okToast=r=>toast(r===QUEUED?'اتحفظ على الموبايل — هيتبعت أول ما النت يرجع':'اتحفظ ✓');
async function savePalm(id,changes,logEntry){
const en=await ensureName();if(!en)return false;if(en==='asked')openPalm(id);
const log=logEntry?Object.assign({d:today(),cid:uid()},logEntry):null;
OV.set(id,Object.assign({},OV.get(id)||{},changes));
if(log)LOGS=[Object.assign({scope:'palm',palmId:id,sector:+id.split('-')[0],by:me,at:'9'},log),...LOGS];
render();
try{const r=await send('savePalm',[id,changes,log,me]);okToast(r);if(r!==QUEUED)refresh();return true}catch(e){fail(e);return false}
}
async function addLog(entry,b64){
if(!await ensureName())return false;
entry=Object.assign({cid:uid()},entry);
const tmp=Object.assign({},entry,{by:me,at:'9',photo:b64?('data:image/jpeg;base64,'+b64):''});LOGS=[tmp,...LOGS];render();
try{const r=await send('addLog',[entry,b64||null,me]);okToast(r);if(r!==QUEUED)refresh();return true}catch(e){fail(e);return false}
}
async function deleteLog(l){
if(!l.id){toast('التسجيل ده لسه ما اتبعتش');return}
LOGS=LOGS.filter(x=>x.id!==l.id);render();
try{await send('deleteLog',[l.id]);toast('اتمسح')}catch(e){fail(e)}
}
async function saveIrr(s,c){IRR[s]=c;render();try{okToast(await send('saveIrr',[s,c]))}catch(e){fail(e)}}
let loading=false,lastSync=LS.get('wf_sync')||'';
function applyData(r){OV.clear();for(const[id,v,pl,pd,st,nt]of r.palms)OV.set(id,{variety:v,planted:!!pl,plantedDate:pd||'',status:st,note:nt});LOGS=r.logs||[];IRR=r.irr||{};applyQueued();render()}
function updateStatus(){const s=$('#sync');const q=QUEUE.length;
s.textContent=(navigator.onLine?'':'أوفلاين • ')+(lastSync?('آخر تحديث '+lastSync):'لسه ما اتحدثش')+(q?(' • '+q+' تسجيل مستني النت'):'');}
async function refresh(){
if(loading)return;loading=true;
try{if(QUEUE.length)await flushQueue();const r=await api('getAll');LS.set('wf_cache',JSON.stringify(r));
lastSync=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});LS.set('wf_sync',lastSync);applyData(r);$('#banner').classList.remove('on');
}catch(e){if(!(e instanceof NetErr))banner('مشكلة في قراية البيانات: '+e.message)}
finally{loading=false;updateStatus()}
}
function banner(t){const b=$('#banner');b.textContent=t;b.classList.add('on')}
/* ---------- GPS: أنا فين ---------- */
const meDot=sv('g',{visibility:'hidden',style:'pointer-events:none'});
const meAcc=sv('circle',{r:5,fill:'rgba(26,115,232,.15)',stroke:'rgba(26,115,232,.5)','stroke-width':1,'vector-effect':'non-scaling-stroke'});
const meC=sv('circle',{r:3,fill:'#1A73E8',stroke:'#fff','stroke-width':2,'vector-effect':'non-scaling-stroke'});
meDot.append(meAcc,meC);gTop.append(meDot);
function llToLocal(lat,lon){const[a,b]=F.llAff;return[a[0]+a[1]*lat+a[2]*lon,b[0]+b[1]*lat+b[2]*lon]}
$('#gps').onclick=()=>{
if(!navigator.geolocation){toast('الموبايل ده مش بيدعم تحديد الموقع');return}
toast('بحدد مكانك…');
navigator.geolocation.getCurrentPosition(pos=>{
const{latitude:la,longitude:lo,accuracy:ac}=pos.coords;const[x,y]=llToLocal(la,lo);
meDot.setAttribute('visibility','visible');meAcc.setAttribute('cx',x);meAcc.setAttribute('cy',y);meAcc.setAttribute('r',Math.max(3,ac));meC.setAttribute('cx',x);meC.setAttribute('cy',y);
let best=null,bd=1e9;for(const q of PALMS){const d=Math.hypot(q.p[0]-x,q.p[1]-y);if(d<bd){bd=d;best=q}}
showView('map');
if(best&&bd<=12){focusPalm(best.id);openPalm(best.id);toast('أقرب نخلة '+C(best.id)+' على بعد '+Math.round(bd)+' م (دقة الموقع ±'+Math.round(ac)+' م)')}
else{const w=Math.max(120,bd*2.5),r=svg.getBoundingClientRect();vb={x:x-w/2,y:y-w*r.height/r.width/2,w,h:w*r.height/r.width};setVB();
toast(bd>2000?'انت مش في الأرض دلوقتي':'انت على بعد '+Math.round(bd)+' م من أقرب نخلة ('+(best?C(best.id):'')+')')}
},err=>toast(err.code===1?'لازم تسمح للصفحة تعرف مكانك من إعدادات المتصفح':'مش قادر أحدد المكان — اتأكد إن الـ GPS شغال'),{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
};
/* ---------- boot ---------- */
$('#whoName').textContent=me||'اكتب اسمك';
$('#who').onclick=async()=>{const n=await askText('اسمك ايه؟','الاسم بيتكتب جنب كل تسجيل.',me);if(n){me=n;LS.set('wf_name',n);$('#whoName').textContent=n}};
$('#refresh').onclick=()=>{refresh();toast('بحدّث…')};
try{const c=JSON.parse(LS.get('wf_cache')||'null');if(c)applyData(c)}catch(e){}
paintMap();showView('map');updateStatus();
window.addEventListener('resize',()=>{if(state.view==='map'){const c=center();const r=svg.getBoundingClientRect();const ar=r.width/r.height;const h=vb.w/ar;vb.y=c.y-h/2;vb.h=h;setVB()}});
refresh();
window.addEventListener('online',()=>{updateStatus();refresh()});
window.addEventListener('offline',updateStatus);
setInterval(()=>{if(document.visibilityState==='visible'&&!(state.sel&&/^[el]:/.test(state.sel)))refresh()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
